name: Deploy to VPS

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/yonetim-app:latest

      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            set -euo pipefail

            mkdir -p ~/yonetim-app
            cd ~/yonetim-app

            curl --fail --show-error \
              -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
              -H "Accept: application/vnd.github.v3.raw" \
              -o docker-compose.yml \
              https://api.github.com/repos/${{ github.repository }}/contents/docker-compose.yml

            export DOCKER_IMAGE=${{ secrets.DOCKER_USERNAME }}/yonetim-app:latest
            docker compose pull
            docker compose up -d db

            # Preserve a recoverable database snapshot before running migrations.
            mkdir -p backups
            backup_file="backups/prod-before-$(date -u +%Y%m%dT%H%M%SZ).dump"
            docker compose exec -T db sh -c 'pg_dump -U "$POSTGRES_USER" -d "$POSTGRES_DB" -Fc' > "$backup_file"

            # Baseline existing pre-Drizzle databases, then apply pending Drizzle migrations.
            docker compose run --rm --no-deps app npm run db:baseline
            docker compose stop app
            docker compose run --rm --no-deps app npm run db:migrate
            docker compose up -d app
